name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  linux:
    # Native Linux VM: /dev/fuse is available, so the full functional test
    # suite (mounting real archives) runs, not just a build check.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libarchive-dev libboost-dev libfuse3-dev libgtest-dev libzip-dev \
            fuse3 pkg-config python3 mount \
            brotli coreutils gpg lrzip lzip lzop lz4 ncompress
      - name: Build and test
        run: |
          make check-fast ASAN=1 UBSAN=1 DEBUG=1
          make clean
          make check-fast ASAN=1 UBSAN=1
          make clean
          make check-fast

  macos:
    # Native macOS VM. This only verifies that fuse-archive compiles and that
    # its unit tests pass. macFUSE needs a kernel extension that requires a
    # reboot and manual user consent (SIP), which isn't possible on an
    # ephemeral CI runner, so no archive can actually be mounted here:
    # tests/test.py (the functional test suite, run via `make check-fast`)
    # is skipped, but unit_tests (pure GoogleTest, no mount needed) is not.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          brew install boost libarchive libzip googletest pkg-config
          # Only needed to get fuse.h and the fuse3.pc pkg-config file for
          # compiling; the bundled kernel extension is never loaded.
          brew install --cask macfuse
      - name: Build
        run: make all
      - name: Unit tests
        run: make unit_tests

  freebsd:
    # GitHub has no native FreeBSD runner. vmactions/freebsd-vm boots a real
    # FreeBSD guest via nested KVM virtualization, which GitHub's Linux
    # runners do support (see libfuse and rmlint's own FreeBSD CI, both
    # using ubuntu-latest for this same job shape) - trying that here
    # instead of macos-latest. Unlike macOS, FreeBSD's fusefs kernel module
    # loads without any interactive consent step, so the full functional
    # test suite runs here too.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and test in FreeBSD VM
        uses: vmactions/freebsd-vm@v1
        with:
          usesh: true
          prepare: |
            pkg install -y pkgconf boost-libs libarchive libzip fusefs-libs3 \
              googletest python3 gmake gnupg
          run: |
            kldload fusefs || true
            # The Makefile uses GNU Make syntax (ifeq, $(shell ...)), which
            # FreeBSD's base bmake can't parse.
            gmake check-fast
